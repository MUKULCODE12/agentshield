name: Sentinel / AgentShield CI Eval Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-eval-suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield_secret_password
          POSTGRES_DB: agentshield_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Test Database
        run: |
          cd backend
          python seed_data.py

      - name: Run Automated Eval Suite & PyTest
        run: |
          cd backend
          pytest tests/test_eval_suite.py --verbose
