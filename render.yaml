# Render.com Infrastructure Blueprint for AgentShield / Sentinel
services:
  # 1. FastAPI Backend Web Service (Docker)
  - type: web
    name: agentshield-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true

  # 2. React + Vite Frontend Static Site
  - type: web
    name: agentshield-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agentshield-backend
          property: host
